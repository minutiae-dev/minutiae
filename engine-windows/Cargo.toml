[package]
name = "minutiae-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Minutiae Windows ASR sidecar — WASAPI capture + sherpa-onnx ASR over sidecar-ipc-v1"
publish = false

# Produces `minutiae-engine[.exe]`. The build script renames it to the
# Tauri target-triple form (e.g. minutiae-engine-x86_64-pc-windows-msvc.exe)
# in app/src-tauri/binaries/.
[[bin]]
name = "minutiae-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WASAPI / MMDevice / QPC bindings — Windows targets only. The portable IPC
# core (ipc, controller, util) builds without these, so `cargo test` runs on
# the macOS dev host.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_Audio",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
] }
