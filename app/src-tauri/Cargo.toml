[package]
name = "minutiae"
version = "0.1.0"
description = "Local-first macOS meeting notepad"
edition = "2021"
rust-version = "1.77"

[lib]
name = "minutiae_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# tauri re-exports its runtime, but we need tokio types directly for
# oneshot/select/time used by the sidecar supervisor (same runtime).
tokio = { version = "1", features = ["sync", "time", "macros"] }

[dev-dependencies]
tempfile = "3"
